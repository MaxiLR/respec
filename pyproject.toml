[project]
name = "respec"
version = "0.1.0"
description = "Switchable global profiles of agent skills across coding harnesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "textual>=8.2",
    "typer>=0.12",
]

[project.scripts]
respec = "respec.cli:app"

[dependency-groups]
dev = [
    "black>=24.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/respec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
